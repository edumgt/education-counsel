name: Azure 배포

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'web/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'infra/**'
  workflow_dispatch:
    inputs:
      imageTag:
        description: '배포할 이미지 태그 (기본: latest)'
        required: false
        default: 'latest'
      environmentName:
        description: '배포 환경 (dev | staging | prod)'
        required: false
        default: 'prod'

permissions:
  id-token: write   # OIDC 인증
  contents: read

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: ai-korean-education-counsel

jobs:
  # ── 1. Docker 이미지 빌드 & ACR 푸시 ────────────────────────
  build:
    name: 이미지 빌드 및 ACR 푸시
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 이미지 태그 설정
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.imageTag }}" ]; then
            echo "tag=${{ inputs.imageTag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure OIDC 로그인
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: ACR 로그인
        run: az acr login --name ${{ env.ACR_LOGIN_SERVER }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:cache,mode=max

  # ── 2. Azure 인프라 배포 (Bicep) ─────────────────────────────
  deploy-infra:
    name: 인프라 배포 (Bicep)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ github.event.inputs.environmentName || 'prod' }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Azure OIDC 로그인
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep 배포
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ env.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: >
            imageTag=${{ needs.build.outputs.image_tag }}
            environmentName=${{ github.event.inputs.environmentName || 'prod' }}
            llmProvider=${{ secrets.LLM_PROVIDER || 'none' }}
            azureOpenAIEndpoint=${{ secrets.AZURE_OPENAI_ENDPOINT || '' }}
            azureOpenAIDeployment=${{ secrets.AZURE_OPENAI_DEPLOYMENT || 'gpt-4o-mini' }}
            openAIApiKey=${{ secrets.OPENAI_API_KEY || '' }}
            azureOpenAIApiKey=${{ secrets.AZURE_OPENAI_API_KEY || '' }}
          deploymentName: aicounsel-${{ github.run_number }}
          failOnStdErr: false

      - name: 배포 결과 출력
        run: |
          echo "배포 완료: ${{ github.run_number }}"
