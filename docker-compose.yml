services:
  init:
    build: ./app
    command: sh /scripts/init.sh
    volumes:
      - ./scripts:/scripts:ro
      - ./DATA_ROOT:/DATA_ROOT:ro
      - ./data:/data
    environment:
      - QDRANT_URL=http://qdrant:6333
      - EMBED_MODEL=intfloat/multilingual-e5-small
    networks:
      - shared-net
    restart: "no"

  webapp:
    build: ./app
    ports:
      - "8855:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - shared-net

networks:
  shared-net:
    external: true
