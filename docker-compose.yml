services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  webapp:
    build: ./app
    ports:
      - "8855:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant

  indexer:
    build: ./app
    command: >
      python /scripts/index_qdrant.py --docs /data/documents.jsonl
    volumes:
      - ./scripts:/scripts:ro
      - ./data:/data:ro
    environment:
      - QDRANT_URL=http://qdrant:6333
      - EMBED_MODEL=intfloat/multilingual-e5-small
    depends_on:
      - qdrant
    profiles:
      - index

volumes:
  qdrant_data:
